name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Required status check. Builds the images and runs the source, Compose,
  # image-label, patch, client and boot verifications. The heavy recovery and
  # maintenance Docker rehearsals are excluded here (see docker-rehearsals) so
  # this gate stays light enough to finish reliably on a hosted runner.
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validate source, Compose, tests, and images
        run: ./scripts/check.sh --build

  # The recovery and maintenance Docker rehearsals each build their own fixture
  # images and run throwaway containers. Isolating them keeps their cost and
  # peak footprint off the required test-and-build gate while still qualifying
  # the updater end to end.
  docker-rehearsals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Recovery and maintenance Docker rehearsals
        run: ./scripts/check.sh --docker-rehearsals
