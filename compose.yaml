name: deepseek-harness

# Portable default: reach a Responses-compatible router on another LAN host.
# External same-engine and managed Ollama deployments apply explicit overlays.

services:
  harness:
    build:
      context: .
      target: harness
      args:
        DSH_VERSION: "${DSH_VERSION:-0.1.1-rc.2}"
        PNPM_VERSION: "${PNPM_VERSION:-11.7.0}"
        DOCKER_CLI_IMAGE: "${DOCKER_CLI_IMAGE:-docker@sha256:d14410ab6f87a2b6c14b7150de787cd7b8bb012a8e900966d6d893e9f7fc49b6}"
    image: "${HARNESS_IMAGE:-local/deepseek-harness:0.1.1-rc.2-portable}"
    labels:
      io.service-portal.update.enabled: "true"
      io.service-portal.update.script: "scripts/update-and-restart.sh"
      io.service-portal.update.image: "${HARNESS_IMAGE:-local/deepseek-harness:0.1.1-rc.2-portable}"
      io.service-portal.update.user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    container_name: deepseek-harness
    restart: unless-stopped
    init: true
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    group_add:
      - "${DOCKER_GID:-999}"
    working_dir: "${HOST_WORKSPACE_ROOT:-/workspace}"
    environment:
      DSH_HOME: /data/dsh
      DSH_TELEMETRY_DISABLED: "1"
      DSH_PERMISSION_MODE: danger-full-access
      HOME: "${HOST_WORKSPACE_ROOT:-/workspace}"
      USER: "${HOST_USERNAME:-harness}"
      LOGNAME: "${HOST_USERNAME:-harness}"
      NVIDIA_SMI_IMAGE: "${NVIDIA_SMI_IMAGE:-ollama/ollama@sha256:77f1a2a54460f0380f2611e1464233d9b82cb6e58afc8f60abec0061049d2d82}"
      HOST_EXEC_IMAGE: "${HARNESS_IMAGE:-local/deepseek-harness:0.1.1-rc.2-portable}"
      OLLAMA_DSH_API_KEY: local-only
      HARNESS_TRUSTED_HOSTS: "${HARNESS_TRUSTED_HOSTS:-127.0.0.1:3443,deepseek-harness.local:3443,localhost:3443}"
    volumes:
      - ./data/dsh:/data/dsh
      - "${HOST_WORKSPACE_ROOT:-/workspace}:${HOST_WORKSPACE_ROOT:-/workspace}"
      - /etc/passwd:/etc/passwd:ro
      - /etc/group:/etc/group:ro
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${HARNESS_BIND_ADDRESS:-127.0.0.1}:${HARNESS_HTTPS_PORT:-3443}:3443"
      - "${HARNESS_BIND_ADDRESS:-127.0.0.1}:${HARNESS_CA_PORT:-3081}:3081"
    networks:
      - ollama_net
    extra_hosts:
      - "ai-router:${REMOTE_OLLAMA_HOST:-192.168.1.21}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3081/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s

  gateway:
    build:
      context: .
      target: gateway
    image: "${GATEWAY_IMAGE:-local/deepseek-harness-gateway:0.1.0-portable}"
    container_name: deepseek-harness-gateway
    restart: unless-stopped
    init: true
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    network_mode: service:harness
    depends_on:
      harness:
        condition: service_started
        restart: true
    environment:
      HARNESS_AUTH_USERNAME: astigmatism
      HARNESS_AUTH_PASSWORD: ICar12..
      HARNESS_TLS_IP: "${HARNESS_TLS_IP:-127.0.0.1}"
      HARNESS_TLS_DNS: "${HARNESS_TLS_DNS:-deepseek-harness.local}"
      HARNESS_BACKEND_URL: http://127.0.0.1:3080
      HARNESS_HTTPS_PORT: "3443"
      HARNESS_PUBLIC_HTTPS_PORT: "${HARNESS_HTTPS_PORT:-3443}"
      HARNESS_CA_PORT: "3081"
      STT_BASE_URL: "${STT_BASE_URL:-}"
      STT_MODEL: "${STT_MODEL:-large-v3-turbo}"
      STT_MAX_BYTES: "${STT_MAX_BYTES:-33554432}"
      STT_TIMEOUT_MS: "${STT_TIMEOUT_MS:-120000}"
      STT_MAX_RECORD_SECONDS: "${STT_MAX_RECORD_SECONDS:-300}"
      STT_API_KEY_FILE: /run/secrets/stt_api_key
      TTS_BASE_URL: "${TTS_BASE_URL:-}"
      TTS_MODEL: "${TTS_MODEL:-tts-1}"
      TTS_VOICE: "${TTS_VOICE:-af_heart}"
      TTS_MAX_BYTES: "${TTS_MAX_BYTES:-1048576}"
      TTS_TIMEOUT_MS: "${TTS_TIMEOUT_MS:-180000}"
      TTS_API_KEY_FILE: /run/secrets/tts_api_key
    volumes:
      - ./data/gateway:/data/gateway
    secrets:
      - stt_api_key
      - tts_api_key
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3081/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s

secrets:
  stt_api_key:
    file: ./secrets/stt_api_key
  tts_api_key:
    file: ./secrets/tts_api_key

networks:
  ollama_net:
    external: false
    name: "${DSH_NETWORK:-deepseek-harness_default}"
