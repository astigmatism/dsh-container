agent-default-model:
  provider: local-ollama
  model: local-active

permission:
  defaultPreset: danger-full-access

# DSH saves this acknowledgement atomically at runtime. Keeping the captured
# version in the seeded writable settings file prevents a fresh deployment
# from being trapped behind the internal-testing notice.
ui-onboarding:
  welcomeNoticeVersion: "2026-08-13.1"

llm-pi-ai:
  providers:
    local-ollama:
      displayName: Local router (128k total)
      apiKeyEnv: OLLAMA_DSH_API_KEY
      api: openai-responses
      baseURL: http://ai-router:11434/v1
      timeoutMs: 600000
      streamIdleTimeoutMs: 600000
      maxConcurrency: 2
      # An omitted per-agent effort must use the router's medium default.
      reasoning: medium
      # The production router uses volatile slot-prefix caching but does not
      # accept OpenAI's explicit prompt_cache_key request field.
      cacheRetention: none
      retryPolicy:
        mode: normal
        maxRetries: 2
        retryableCodes: [EMPTY_RESPONSE, RATE_LIMIT, SERVER, TRANSPORT]
      models:
        - id: local-active
          name: Local active model (128k total)
          contextWindow: 131072
          maxTokens: 32768
          input: [text, image]
          reasoningEfforts:
            off: none
            minimal: low
            low: low
            medium: medium
            high: xhigh
            xhigh: xhigh
            max: xhigh
    local-ollama-256:
      displayName: Local router (256k total)
      apiKeyEnv: OLLAMA_DSH_API_KEY
      api: openai-responses
      baseURL: http://ai-router:11434/v1
      timeoutMs: 600000
      streamIdleTimeoutMs: 600000
      maxConcurrency: 1
      # An omitted per-agent effort must use the router's medium default.
      reasoning: medium
      # The production router uses volatile slot-prefix caching but does not
      # accept OpenAI's explicit prompt_cache_key request field.
      cacheRetention: none
      retryPolicy:
        mode: normal
        maxRetries: 2
        retryableCodes: [EMPTY_RESPONSE, RATE_LIMIT, SERVER, TRANSPORT]
      models:
        - id: local-active
          name: Local active model (256k total)
          contextWindow: 262144
          maxTokens: 32768
          input: [text, image]
          reasoningEfforts:
            off: none
            minimal: low
            low: low
            medium: medium
            high: xhigh
            xhigh: xhigh
            max: xhigh
