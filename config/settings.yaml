agent-default-model:
  provider: local-ollama
  model: local-active
  reasoningEffort: medium

permission:
  defaultPreset: danger-full-access

llm-pi-ai:
  providers:
    local-ollama:
      displayName: Local Ollama
      apiKeyEnv: OLLAMA_DSH_API_KEY
      api: openai-responses
      baseURL: http://ai-router:11434/v1
      timeoutMs: 600000
      streamIdleTimeoutMs: 600000
      models:
        - id: local-active
          name: Local active model
          contextWindow: 131072
          maxTokens: 32768
          input: [text, image]
          reasoningEfforts:
            off: none
            minimal: minimal
            low: low
            medium: medium
            high: high
            xhigh: xhigh
            max: max
