agent-default-model:
  provider: local-ollama-256k
  model: local-active
  reasoningEffort: max

permission:
  defaultPreset: danger-full-access

# DSH saves this acknowledgement atomically at runtime. Keeping the captured
# version in the seeded writable settings file prevents a fresh deployment
# from being trapped behind the internal-testing notice.
ui-onboarding:
  welcomeNoticeVersion: "2026-08-13.1"

llm-pi-ai:
  providers:
    local-ollama:
      displayName: Local Ollama (128k)
      apiKeyEnv: OLLAMA_DSH_API_KEY
      api: openai-responses
      baseURL: http://ai-router:11434/v1
      timeoutMs: 600000
      streamIdleTimeoutMs: 600000
      retryPolicy:
        mode: normal
        maxRetries: 2
        retryableCodes: [ EMPTY_RESPONSE, RATE_LIMIT, SERVER, TRANSPORT ]
      models:
        - id: local-active
          name: Local active model (128k)
          contextWindow: 131072
          maxTokens: 32768
          input: [ text, image ]
          reasoningEfforts:
            off: none
            minimal: minimal
            low: low
            medium: medium
            high: high
            xhigh: xhigh
            max: max
    local-ollama-256k:
      displayName: Local Ollama (256k)
      apiKeyEnv: OLLAMA_DSH_API_KEY
      api: openai-responses
      baseURL: http://ai-router:11434/v1
      timeoutMs: 600000
      streamIdleTimeoutMs: 600000
      retryPolicy:
        mode: normal
        maxRetries: 2
        retryableCodes: [ EMPTY_RESPONSE, RATE_LIMIT, SERVER, TRANSPORT ]
      models:
        - id: local-active
          name: Local active model (256k)
          contextWindow: 262144
          maxTokens: 32768
          input: [ text, image ]
          reasoningEfforts:
            off: none
            minimal: minimal
            low: low
            medium: medium
            high: high
            xhigh: xhigh
            max: max
