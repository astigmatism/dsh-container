# One route per router, and its model list is the catalog that router publishes:
# the router-model-discovery plugin writes one row per service ID, titled with
# the router's own names for them. Requests carry service IDs, never canonical
# model IDs. See docs/llm-router-contract.md.
# `trial` is opt-in: it is never the default and never a fallback target, and a
# session reaches it only when a human selects it in the picker.
# The names and limits below are placeholders for the moment before the first
# successful discovery; nothing here is a list of what the router offers.
agent-default-model:
  provider: local-ollama
  model: daytime
  reasoningEffort: medium

permission:
  defaultPreset: danger-full-access

# Seeded once per missing field; later user choices survive image recreation.
dsh-better-sidebar:
  tabsEnabled:
    subagent: true
    sidechat: false

# Preserve the previously acknowledged notice. Harness 0.2 may present its
# newer preview notice; an upgrade must not acknowledge new copy for the user.
ui-onboarding:
  welcomeNoticeVersion: "2026-08-13.1"

llm-pi-ai:
  providers:
    local-ollama:
      # The route to this deployment's router. Discovery renames it to the name
      # the router publishes for itself and replaces its models with the catalog.
      displayName: Local router
      apiKeyEnv: OLLAMA_DSH_API_KEY
      api: openai-responses
      baseURL: http://ai-router:11434/v1
      streamIdleTimeoutMs: 900000
      maxConcurrency: 1
      reasoning: medium
      # Medium is a DSH choice; the router raw default remains template-defined.
      # The production router uses volatile slot-prefix caching but does not
      # accept OpenAI's explicit prompt_cache_key request field.
      cacheRetention: none
      retryPolicy:
        mode: normal
        maxRetries: 2
        retryableCodes: [EMPTY_RESPONSE, RATE_LIMIT, SERVER, TRANSPORT]
      # Placeholder limits until the first successful router discovery, which
      # replaces them with the serving model's context_window (less
      # context_safety_reserve), slots, input modalities and reasoning levels.
      models:
        - id: daytime
          name: daytime
          contextWindow: 131072
          maxTokens: null
          input: [text, image]
          reasoningEfforts:
            off: none
            minimal: low
            low: low
            medium: medium
            high: xhigh
            xhigh: xhigh
            max: xhigh
