# Resident routes send the LLM Router's stable service IDs (daytime, nighttime),
# never canonical model IDs. See docs/llm-router-contract.md.
agent-default-model:
  provider: local-ollama
  model: daytime
  reasoningEffort: medium

permission:
  defaultPreset: danger-full-access

# Seeded once per missing field; later user choices survive image recreation.
dsh-better-sidebar:
  tabsEnabled:
    subagent: true
    sidechat: false

# Preserve the previously acknowledged notice. Harness 0.2 may present its
# newer preview notice; an upgrade must not acknowledge new copy for the user.
ui-onboarding:
  welcomeNoticeVersion: "2026-08-13.1"

llm-pi-ai:
  providers:
    local-ollama:
      displayName: Daytime (128K)
      apiKeyEnv: OLLAMA_DSH_API_KEY
      api: openai-responses
      baseURL: http://ai-router:11434/v1
      streamIdleTimeoutMs: 900000
      maxConcurrency: 1
      reasoning: medium
      # Medium is a DSH choice; the router raw default remains template-defined.
      # The production router uses volatile slot-prefix caching but does not
      # accept OpenAI's explicit prompt_cache_key request field.
      cacheRetention: none
      retryPolicy:
        mode: normal
        maxRetries: 2
        retryableCodes: [EMPTY_RESPONSE, RATE_LIMIT, SERVER, TRANSPORT]
      # Placeholder limits until the first successful router discovery. The
      # router-model-discovery plugin replaces them with the serving model's
      # context_window (less context_safety_reserve), slots and features.
      models:
        - id: daytime
          name: Daytime (128K)
          contextWindow: 131072
          maxTokens: null
          input: [text, image]
          reasoningEfforts:
            off: none
            minimal: low
            low: low
            medium: medium
            high: xhigh
            xhigh: xhigh
            max: xhigh
    local-everyday:
      displayName: Nighttime (128K)
      apiKeyEnv: OLLAMA_DSH_API_KEY
      api: openai-responses
      baseURL: http://ai-router:11434/v1
      streamIdleTimeoutMs: 900000
      maxConcurrency: 1
      reasoning: medium
      # Medium is a DSH choice; the router raw default remains template-defined.
      # The production router uses volatile slot-prefix caching but does not
      # accept OpenAI's explicit prompt_cache_key request field.
      cacheRetention: none
      retryPolicy:
        mode: normal
        maxRetries: 2
        retryableCodes: [EMPTY_RESPONSE, RATE_LIMIT, SERVER, TRANSPORT]
      # Placeholder limits until the first successful router discovery.
      models:
        - id: nighttime
          name: Nighttime (128K)
          contextWindow: 131072
          maxTokens: null
          input: [text]
          reasoningEfforts:
            off: none
            minimal: low
            low: low
            medium: medium
            high: xhigh
            xhigh: xhigh
            max: xhigh
