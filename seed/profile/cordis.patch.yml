# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: web-search-deepseek
  disabled: true

- id: web
  config:
    searchProvider: duckduckgo

# A first-prompt title request otherwise competes with the agent turn for the
# single Ollama worker. DSH still creates its immediate fallback title.
- id: session-title-llm
  disabled: true

# Web disables the base compaction stack by default. Re-enable the complete
# durable path here: proactive step pressure, one bounded canonical-overflow
# recovery, the idle /compact operator command, and replay-safe tool pruning.
#
# The local route can admit at most 97,280 formatted input tokens while keeping
# its 32,768 output allowance and the router's 1,024-token reserve. A 0.70
# policy triggers at 91,750, leaving 5,530 tokens for meter/serialization/
# tokenizer uncertainty. The captured incident measured 99,735 in token-meter
# before the rejected 101,165-token formatted request, so both provider IDs
# must share this exact endpoint policy.
- id: compaction-basic
  disabled: false
  config:
    auto: true
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1
    maxOverflowRetries: 1
    modelPolicies:
      - provider: local-ollama
        model: local-active
        thresholdRatio: 0.70
      - provider: local-ollama-256k
        model: local-active
        thresholdRatio: 0.70

- id: command-compact
  disabled: false

- id: tool-result-pruner
  disabled: false
  config:
    thresholdChars: 8192
    headChars: 4096
    tailChars: 1024

# The browser remains headless inside the container while its CDP screencast is
# rendered in DSH's Browser Use panel. Private targets are an explicit
# deployment choice because enabling them also permits private subresources.
- id: dsh-playwright
  config:
    browserExecutablePath: /usr/bin/chromium
    viewportWidth: 1440
    viewportHeight: 900
    allowPrivateHosts: !!js "(process.env.DSH_BROWSER_ALLOW_PRIVATE_HOSTS ?? 'false').toLowerCase() === 'true'"

- insert:
    - id: web-search-duckduckgo
      name: '../../.dsh-plugins/dsh-web-search-free.js?v=2'
      config:
        baseURL: https://html.duckduckgo.com/html/

- insert:
    - id: loop-detector
      name: 'dsh-loop-detector'
      config:
        minLen: 512
        maxRetries: 1
        checkReasoning: true
        # Provider-independent semantic progress containment. These defaults
        # are explicit here so production bounds and contract tests share one
        # reviewed configuration surface. The read defaults match the pinned
        # @deepseek-ai/dsh-tool-fs schema/runtime (offset 1, limit 2000).
        readOnlyDirective: 4
        readOnlyHard: 8
        continuationDirective: 12
        continuationHard: 24
        reasoningPrefixChars: 128
        reasoningDirectiveOccurrence: 2
        reasoningHardOccurrence: 3
        readDefaultOffset: 1
        readDefaultLimit: 2000

- insert:
    - id: router-model-discovery
      name: '../../.dsh-plugins/dsh-router-model-discovery.js?v=8'
      config:
        providers: [ local-ollama, local-ollama-256k ]
        model: local-active
        pollIntervalMs: 30000
