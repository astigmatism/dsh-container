# Repository defaults. The writable profile patch is applied after this bundle.

# Let the native executor own the one deadline and preserve timed-out output.
# Explicit requests may extend a foreground command to ten minutes; Stop still
# cancels its process tree. This profile is shipped to every deployment.
- id: bash-sandbox
  config:
    timeoutMs: 120000
    maxTimeoutMs: 600000

- id: web-search-deepseek
  disabled: true

# This deployment serves only the two local resident models. Disabling the
# adapter prevents upstream's default DeepSeek catalog from entering the picker.
- id: llm-deepseek
  disabled: true

- id: web
  config:
    searchProvider: duckduckgo

# A prompt sent while the agent is working steers the running Turn instead of
# queueing behind it; Cmd/Ctrl+Enter queues. Host-backed pages read this value.
# Remote Web pages (LAN and gateway URLs) never read Host settings, so the build
# patch scripts/patch-dsh-busy-enter-steer.mjs makes steer the browser default too.
- id: ui-conversation
  config:
    busyEnter: steer

# Model-written session titles from the first prompt. DSH shows its immediate
# first-words fallback until the generated title arrives. The build patch
# (scripts/patch-dsh-session-title-reasoning.mjs) disables reasoning for this
# auxiliary call when the route offers "off", so resident reasoning models
# answer within the 64-token title budget in about a second. On a single-slot
# provider the request waits behind the session's first model call; the
# deadline covers that wait as well as generation. A patch replaces the whole
# config, so restate upstream's required fields (no library defaults).
- id: session-title-llm
  config:
    targetWords: 5
    targetCjkCharacters: 10
    maxInputBytes: 4096
    maxOutputTokens: 64
    timeoutMs: 600000

# Token remains installed, but its incompatible bundle is not activated on 0.2.
# Its v4 session reader and memory behavior are not qualified for this runtime.

# The build applies these settings to each native agent preset. Keep the host
# copies disabled: presets own the isolated compaction and pruning services.
#
# Working-context pressure triggers disclosed, durable compaction at 70%.
# Summaries have no injected output quota; original events remain in storage.
- id: compaction-basic
  disabled: true
  config:
    auto: true
    retainRatio: 0.16
    headroomTokens: 0
    maxTokens: null
    compactionRetries: 1
    maxOverflowRetries: 1
    # Policies match the router service IDs that resident routes send.
    modelPolicies:
      - provider: local-ollama
        model: daytime
        thresholdRatio: 0.70
      - provider: local-everyday
        model: nighttime
        thresholdRatio: 0.70

- id: command-compact
  disabled: true

- id: tool-result-pruner
  disabled: true
  config:
    thresholdChars: 8192
    headChars: 4096
    tailChars: 1024

# Ego runs the existing Chromium, with persistent shared website logins.
# Conversation/tab association and the deployment network policy live in the
# pinned container adapter. No browser control port is published.
- id: ego-browser
  config:
    chromePath: /usr/bin/chromium
    chromeArgs: --no-sandbox --disable-dev-shm-usage
    captureBackend: cdp
    isolateSpaces: false
    idleTimeoutMin: 10
    cdpFps: 15
    cdpMaxWidth: 1440

- insert:
    - id: web-search-duckduckgo
      # Bundle paths resolve from profiles/web/node_modules/dsh-container-profile.
      name: '../../../../.dsh-plugins/dsh-web-search-free.js'
      config:
        baseURL: https://html.duckduckgo.com/html/

- insert:
    - id: loop-detector
      name: 'dsh-loop-detector'
      config:
        repeatedTestTimeouts: 2
        minLen: 512
        maxRetries: 1
        checkReasoning: true
        # Provider-independent semantic progress guidance. These defaults are
        # explicit here so the advisory checkpoint and contract tests share one
        # reviewed configuration surface. Distinct repository reads and model
        # continuations are never capped by count. The read defaults only
        # canonicalize duplicate-read detection and match the pinned
        # @deepseek-ai/dsh-tool-fs runtime.
        continuationDirective: 12
        reasoningPrefixChars: 128
        reasoningDirectiveOccurrence: 2
        reasoningHardOccurrence: 3
        readDefaultOffset: 1
        readDefaultLimit: 2000

# LLM Router client contract v1 (docs/llm-router-contract.md): read
# /v1/router/capabilities, follow /v1/router/events, poll every 30 s with
# If-None-Match while the stream is down. Requests identify themselves as
# deepseek-harness/<HARNESS_CLIENT_INSTANCE or hostname>; set clientInstance
# here to override the instance name.
- insert:
    - id: router-model-discovery
      name: '../../../../.dsh-plugins/dsh-router-model-discovery.js'
      config:
        providers: [ local-ollama, local-everyday ]
        pollIntervalMs: 30000

# Suggested follow-up prompts beneath the latest completed answer. The live
# on/off switch is Settings > General > Suggest follow-up prompts; the choice
# is stored in the writable profile patch under this entry id. Requests use
# the conversation's own route with reasoning off, and are aborted whenever
# new work starts on the same provider. Defaults (enabled, 3 suggestions,
# 1024 output tokens, 60 s) live in the plugin schema: a Settings write copies
# this row's config into the user layer, so keep it empty to avoid pinning
# them. See profiles/web/plugins/dsh-follow-up-suggestions/README.md.
- insert:
    - id: follow-up-suggestions
      name: 'dsh-follow-up-suggestions'
