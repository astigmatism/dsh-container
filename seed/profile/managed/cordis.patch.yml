# Repository defaults. The writable profile patch is applied after this bundle.

# Let the native executor own the one deadline and preserve timed-out output.
# Explicit requests may extend a foreground command to ten minutes; Stop still
# cancels its process tree. This profile is shipped to every deployment.
- id: bash-sandbox
  config:
    timeoutMs: 120000
    maxTimeoutMs: 600000

- id: web-search-deepseek
  disabled: true

# This deployment serves only the two local resident models. Disabling the
# adapter prevents upstream's default DeepSeek catalog from entering the picker.
- id: llm-deepseek
  disabled: true

- id: web
  config:
    searchProvider: duckduckgo

# A first-prompt title request otherwise competes with the agent turn for the
# single Ollama worker. DSH still creates its immediate fallback title.
- id: session-title-llm
  disabled: true

# Token remains installed, but its incompatible bundle is not activated on 0.2.
# Its v4 session reader and memory behavior are not qualified for this runtime.

# The build applies these settings to each native agent preset. Keep the host
# copies disabled: presets own the isolated compaction and pruning services.
#
# Working-context pressure triggers disclosed, durable compaction at 70%.
# Summaries have no injected output quota; original events remain in storage.
- id: compaction-basic
  disabled: true
  config:
    auto: true
    retainRatio: 0.16
    headroomTokens: 0
    maxTokens: null
    compactionRetries: 1
    maxOverflowRetries: 1
    modelPolicies:
      - provider: local-ollama
        model: local-active
        thresholdRatio: 0.70
      - provider: local-everyday
        model: qwen3.8-27b-abliterated-q6_k
        thresholdRatio: 0.70

- id: command-compact
  disabled: true

- id: tool-result-pruner
  disabled: true
  config:
    thresholdChars: 8192
    headChars: 4096
    tailChars: 1024

# Ego runs the existing Chromium, with persistent shared website logins.
# Conversation/tab association and the deployment network policy live in the
# pinned container adapter. No browser control port is published.
- id: ego-browser
  config:
    chromePath: /usr/bin/chromium
    chromeArgs: --no-sandbox --disable-dev-shm-usage
    captureBackend: cdp
    isolateSpaces: false
    idleTimeoutMin: 10
    cdpFps: 15
    cdpMaxWidth: 1440

- insert:
    - id: web-search-duckduckgo
      # Bundle paths resolve from profiles/web/node_modules/dsh-container-profile.
      name: '../../../../.dsh-plugins/dsh-web-search-free.js'
      config:
        baseURL: https://html.duckduckgo.com/html/

- insert:
    - id: loop-detector
      name: 'dsh-loop-detector'
      config:
        repeatedTestTimeouts: 2
        minLen: 512
        maxRetries: 1
        checkReasoning: true
        # Provider-independent semantic progress guidance. These defaults are
        # explicit here so the advisory checkpoint and contract tests share one
        # reviewed configuration surface. Distinct repository reads and model
        # continuations are never capped by count. The read defaults only
        # canonicalize duplicate-read detection and match the pinned
        # @deepseek-ai/dsh-tool-fs runtime.
        continuationDirective: 12
        reasoningPrefixChars: 128
        reasoningDirectiveOccurrence: 2
        reasoningHardOccurrence: 3
        readDefaultOffset: 1
        readDefaultLimit: 2000

- insert:
    - id: router-model-discovery
      name: '../../../../.dsh-plugins/dsh-router-model-discovery.js'
      config:
        providers: [ local-ollama, local-everyday ]
        model: local-active
        pollIntervalMs: 30000
