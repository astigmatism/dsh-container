packages:
  - .

nodeLinker: hoisted
autoInstallPeers: false

# The live console requires the platform-specific PTY binary. Do not grant
# blanket build-script approval to the rest of the plugin dependency tree.
allowBuilds:
  node-pty: true

patchedDependencies:
  dsh-loop-detector@1.0.0: patches/dsh-loop-detector@1.0.0.patch

minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-brand@0.2.0-rc.2'
  - '@deepseek-ai/dsh-llm@0.2.0-rc.2'
  - '@deepseek-ai/dsh-timeout@0.2.0-rc.2'
  - '@deepseek-ai/dsh-typert-protocol@0.2.0-rc.2'
  - '@deepseek-ai/dsh-util-crypto@0.2.0-rc.2'
  - '@deepseek-ai/dsh-util-values@0.2.0-rc.2'
  - dsh-context@0.62.2
  - dsh-session-pin@0.7.16
  - dsh-ui-appearance@0.1.17

# Retain established editor internals while the new releases are inside pnpm's
# minimum-release-age window. Both versions satisfy the installed plugins.
overrides:
  '@lezer/common': 1.5.2
  '@lezer/highlight': 1.2.3
