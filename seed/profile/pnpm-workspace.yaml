packages:
  - .

nodeLinker: hoisted
autoInstallPeers: false

# The live console requires the platform-specific PTY binary. Do not grant
# blanket build-script approval to the rest of the plugin dependency tree.
allowBuilds:
  node-pty: true

patchedDependencies:
  dsh-loop-detector@1.0.0: patches/dsh-loop-detector@1.0.0.patch
  dsh-playwright@0.1.0: patches/dsh-playwright@0.1.0.patch

minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-brand@0.1.5-rc.2'
  - '@deepseek-ai/dsh-llm@0.1.5-rc.2'
  - '@deepseek-ai/dsh-timeout@0.1.5-rc.2'
  - '@deepseek-ai/dsh-typert-protocol@0.1.5-rc.2'
  - '@deepseek-ai/dsh-util-crypto@0.1.5-rc.2'
  - '@deepseek-ai/dsh-util-values@0.1.5-rc.2'
  - dsh-context@0.52.0
  - dsh-session-pin@0.7.11
